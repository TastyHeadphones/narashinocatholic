<h2>洗礼<span class="en">(BAPTISM)</span></h2>
<p>①成人洗礼は原則として、復活祭の時に授けられます。</p>
<p>②幼児洗礼は原則として主日のミサの中で授けられます。</p>
<p>洗礼を望まれる方は、早めに主任司祭にお申し出ください。</p>
<p>洗礼の準備は必要に応じて行われます。</p>
<h2>ゆるしの秘跡</h2>
<p>日曜日各ミサ30分前から</p>
<p>この時間以外は、司祭にお申し出ください。</p>
<h2>病者の秘跡</h2>
<p>入院する時に主任司祭に知らせてください。</p>
<h2>初聖体、堅信</h2>
<p>準備講座をお知らせします。</p>
<h2>結婚</h2>
<p>主任司祭にお申し出ください。</p>
