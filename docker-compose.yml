# ローカル開発用の環境。`docker compose up -d` で起動し、
# 続いて wpcli コンテナがインストールと内容の投入を行う。
# 詳しくは README.md を参照。

name: narashino-catholic

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.4-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WP_DEBUG:-}
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/narashino-catholic:/var/www/html/wp-content/themes/narashino-catholic

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    # 初回のみ実行されて終了する。www-data（WordPress と同じユーザー）で動かし、アップロードの権限を揃える。
    entrypoint: ["sh", "/seed/setup.sh"]
    restart: "no"
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-カトリック習志野教会}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-me-now}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/narashino-catholic:/var/www/html/wp-content/themes/narashino-catholic
      - ./seed:/seed:ro

volumes:
  db_data:
  wp_core:
